events {}
http {
    gzip on;
    gzip_types text/plain application/json;
    server {
        listen 80;
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "no-referrer";
        add_header Content-Security-Policy "default-src 'none'";
        location /stub_status {
            stub_status on;
        }
        location /mcp/material/ {
            proxy_pass http://mcp-material:8080/;
        }
        location /mcp/compliance/ {
            proxy_pass http://mcp-compliance:8081/;
        }
        location /mcp/lca/ {
            proxy_pass http://mcp-lca:8082/;
        }
        location / {
            proxy_pass http://orchestrator:8090/;
        }
    }
}
