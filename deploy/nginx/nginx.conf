worker_processes auto;
events { worker_connections 1024; }
http {
  include       mime.types;
  default_type  application/octet-stream;
  sendfile on; tcp_nopush on; tcp_nodelay on; keepalive_timeout 65;

  # gzip
  gzip on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/json application/javascript application/xml text/xml image/svg+xml;

  # security headers
  map $http_origin $cors_allow { default ""; "~^https?://.*$" "$http_origin"; }
  limit_req_zone $binary_remote_addr zone=api_zone:10m rate=10r/s;

  upstream mcp_material { server mcp-material:8080; }
  upstream orchestrator  { server orchestrator:8090; }
  upstream mcp_compliance { server mcp-compliance:8081; }
  upstream mcp_lca { server mcp-lca:8082; }

  server {
    listen ${WEB_PORT};
    server_name _;

    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "DENY";
    add_header Referrer-Policy "no-referrer";

    # MCP-material
    location /mcp/material/ {
      limit_req zone=api_zone burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://mcp_material;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key";
        return 204;
      }
      add_header Access-Control-Allow-Origin $cors_allow;
    }

    # (optional) compliance
    location /mcp/compliance/ {
      limit_req zone=api_zone burst=20 nodelay;
      proxy_pass http://mcp_compliance;
      add_header Access-Control-Allow-Origin $cors_allow;
    }

    # (optional) lca
    location /mcp/lca/ {
      limit_req zone=api_zone burst=20 nodelay;
      proxy_pass http://mcp_lca;
      add_header Access-Control-Allow-Origin $cors_allow;
    }

    # Orchestrator + UI
    location / {
      limit_req zone=api_zone burst=20 nodelay;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
      proxy_set_header X-Forwarded-Proto $scheme;
      proxy_pass http://orchestrator;
      if ($request_method = OPTIONS) {
        add_header Access-Control-Allow-Origin $cors_allow;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Authorization, Content-Type, X-API-Key";
        return 204;
      }
      add_header Access-Control-Allow-Origin $cors_allow;
    }

    # exporter endpoint
    location /stub_status {
      stub_status on;
      access_log off;
    }
  }
}
