version: "3.9"
services:
  mcp-material:
    build:
      context: ../services/mcp-material
      dockerfile: Dockerfile
    environment:
      ENV: prod
      HOST: 0.0.0.0
      PORT: 8080
      DATA_ROOT: /app/data
      RESOURCES_ROOT: /app/resources
      API_KEY: ${MCP_API_KEY}
    volumes:
      - ../services/mcp-material/resources:/app/resources:ro
      - mcp_data:/app/data
    expose: ["8080"]
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost:8080/health"]
      interval: 15s
      timeout: 3s
      retries: 10

  orchestrator:
    build:
      context: ../services/orchestrator
    environment:
      MCP_BASE_URL: http://mcp-material:8080
      MCP_API_KEY: ${MCP_API_KEY}
      MCP_REGION: EU-Central
    depends_on:
      mcp-material:
        condition: service_healthy
    expose: ["8090"]

  nginx:
    image: nginx:1.27-alpine
    depends_on:
      - mcp-material
      - orchestrator
    ports:
      - "${WEB_PORT}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro

  nginx-exporter:
    image: nginxinc/nginx-prometheus-exporter:0.11.0
    depends_on: [nginx]
    command: ["-nginx.scrape-uri", "http://nginx:80/stub_status"]
    expose: ["9113"]

  prometheus:
    image: prom/prometheus:v2.54.0
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command: ["--config.file=/etc/prometheus/prometheus.yml","--web.enable-lifecycle"]
    ports:
      - "${PROMETHEUS_PORT}:9090"

  grafana:
    image: grafana/grafana:11.1.0
    ports:
      - "${GRAFANA_PORT}:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro

volumes:
  mcp_data:
