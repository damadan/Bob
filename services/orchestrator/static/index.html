<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>MCP Orchestrator</title>
</head>
<body>
  <h1>MCP Orchestrator</h1>
  <form id="run-form">
    <label>
      Project ID: <input type="text" name="project_id" required />
    </label><br />
    <label>
      Region:
      <select name="region">
        <option value="eu-central">EU-Central</option>
        <option value="ru-moscow">RU-Moscow</option>
      </select>
    </label><br />
    <label>
      File: <input type="file" name="file" accept=".pdf,.ifc" required />
    </label><br />
    <button type="submit">Submit</button>
  </form>

  <div id="message"></div>

  <h2>Artifacts</h2>
  <ul id="links"></ul>

  <h2>Priced Preview</h2>
  <table id="preview"></table>

  <script>
    document.getElementById('run-form').addEventListener('submit', async (e) => {
      e.preventDefault();
      const form = e.target;
      const formData = new FormData(form);

      const msg = document.getElementById('message');
      const links = document.getElementById('links');
      const table = document.getElementById('preview');

      msg.textContent = '';
      msg.style.color = '';
      links.innerHTML = '';
      table.innerHTML = '';

      try {
        const response = await fetch('/run_multipart', {
          method: 'POST',
          body: formData
        });
        const data = await response.json();

        if (!response.ok) {
          msg.textContent = data.detail || 'Request failed';
          msg.style.color = 'red';
          return;
        }

        if (data.artifacts) {
          Object.entries(data.artifacts).forEach(([key, url]) => {
            const li = document.createElement('li');
            const a = document.createElement('a');
            a.href = url;
            a.textContent = key.replace('_url', '').toUpperCase();
            a.target = '_blank';
            li.appendChild(a);
            links.appendChild(li);
          });
        }

        if (data.priced_bom && Array.isArray(data.priced_bom.items)) {
          const thead = document.createElement('thead');
          const headerRow = document.createElement('tr');
          ['name', 'qty', 'unit', 'price', 'total'].forEach(col => {
            const th = document.createElement('th');
            th.textContent = col;
            headerRow.appendChild(th);
          });
          thead.appendChild(headerRow);
          table.appendChild(thead);

          const tbody = document.createElement('tbody');
          data.priced_bom.items.forEach(item => {
            const tr = document.createElement('tr');
            ['name', 'qty', 'unit', 'price', 'total'].forEach(col => {
              const td = document.createElement('td');
              td.textContent = item[col] ?? '';
              tr.appendChild(td);
            });
            tbody.appendChild(tr);
          });
          table.appendChild(tbody);
        }
      } catch (err) {
        msg.textContent = 'Request failed: ' + err;
        msg.style.color = 'red';
      }
    });
  </script>
</body>
</html>
